# Lakeflow Spark Declarative Pipeline for the rovia_ai_co_pilot_workspace
# bronze domain — one Auto Loader streaming table per atlas_prod subfolder,
# generated entirely from config/rovia_ai_co_pilot_workspace/. Source code:
# src/rovia_ingestion_etl/transformations/pipeline.py (pyspark.pipelines).

resources:
  pipelines:
    rovia_ingestion_etl:
      name: rovia_ingestion_etl
      catalog: ${var.catalog}
      schema: ${var.bronze_schema}
      serverless: true
      channel: CURRENT
      root_path: "../src/rovia_ingestion_etl"

      libraries:
        - glob:
            include: ../src/rovia_ingestion_etl/transformations/**

      environment:
        dependencies:
          # datalab FRAMEWORK wheel — installed from this project's own
          # catalog volume (rovia_ai_co_pilot_workspace.artifacts.wheels).
          # `make publish-wheel` uploads it; bump var.datalab_version to roll it.
          - ${var.datalab_wheel}
          # This domain's own wheel — built by the bundle's
          # rovia_ingestion_etl_wheel artifact (uv build --wheel).
          - ../dist/rovia_ingestion_etl-*.whl

      # Surfaced to pipeline code as Spark conf — read via datalab.config.pipeline_conf.
      configuration:
        datalab.env: ${bundle.target}
        datalab.catalog: ${var.catalog}
        datalab.bronze_schema: ${var.bronze_schema}
        # Where the framework finds this domain's layer YAMLs (deployed
        # workspace files — see docs/FRAMEWORK.md in datalab-framework).
        datalab.config_dir: ${workspace.file_path}/config/rovia_ai_co_pilot_workspace
        # --- BEGIN GENERATED ATLAS_PROD LANDING PATHS ---
        # Managed by scripts/generate_bronze_tables.py — one
        # datalab.landing_<table> key per s3://.../atlas_prod/<table>/
        # subfolder, matching path_conf in the atlas_bronze_ingest template.
        # Do not hand-edit this block; re-run the script instead.
        datalab.landing_campaign_rewards_v2: s3://rovia-dms-s3-lake-databricks/atlas_prod/campaign_rewards_v2/
        datalab.landing_campaigns_v2: s3://rovia-dms-s3-lake-databricks/atlas_prod/campaigns_v2/
        datalab.landing_cash_activity_sync_state: s3://rovia-dms-s3-lake-databricks/atlas_prod/cash_activity_sync_state/
