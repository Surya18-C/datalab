resources:
  jobs:
    rovia_faq_copy:
      name: rovia_faq_copy
      tasks:
        - task_key: copy_faq_pdfs
          python_wheel_task:
            package_name: rovia_ingestion_etl
            entry_point: copy_faqs
          environment_key: serverless

      environments:
        - environment_key: serverless
          spec:
            client: "1"
            dependencies:
              - ../dist/rovia_ingestion_etl-*.whl