# Rovia_Ingestion — atlas_prod -> rovia_ai_co_pilot_workspace.dev_bronze,
# one streaming table per S3 subfolder, on the datalab framework
# (https://github.com/dediggibyte/datalab-framework). This project holds the
# configs + domain code + deploy bundle; the framework does the generation.

[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name            = "rovia_ingestion_etl"
version         = "0.1.0"
description     = "Rovia atlas_prod bronze ingestion (S3 -> rovia_ai_co_pilot_workspace.dev_bronze) on the datalab framework."
requires-python = ">=3.10,<3.14"   # Databricks serverless job runtime is Python 3.10+
dependencies = [
]

[project.scripts]
copy_faqs = "rovia_ingestion_etl.transformations.pipeline:main"

[dependency-groups]
dev = [
    # Local dev / CI consumption mode. Databricks installs the framework
    # wheel separately from the catalog volume.
    "datalab @ git+https://github.com/dediggibyte/datalab-framework@v0.10.0",
    "pytest>=8.4",
    "ruff>=0.14",
    # Local Spark for tests + `datalab.framework.devtools` (capture_graph,
    # run_dataset). Capped <4.3 — see datalab-framework/pyproject.toml for why.
    "pyspark[pipelines]>=4.1.0,<4.3",
    "pandas>=2.0",
]
# Author-time only: scripts/generate_bronze_tables.py discovers atlas_prod
# subfolders and regenerates config/. Never installed into the pipeline.
scripts = [
    "boto3>=1.34",
    "PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rovia_ingestion_etl"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-ra --tb=short"

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rovia_ingestion_etl"]

[tool.uv]
managed = true
